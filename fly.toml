app = "annshaven"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_DEBUG = "false"
  APP_ENV = "production"
  APP_URL = "https://annshaven.fly.dev"
  CACHE_STORE = "database"
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/var/www/html/storage/database.sqlite"
  FILESYSTEM_DISK = "local"
  LOG_CHANNEL = "stderr"
  LOG_LEVEL = "info"
  QUEUE_CONNECTION = "database"
  SESSION_DRIVER = "database"
  SESSION_SECURE_COOKIE = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true

  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    method = "GET"
    path = "/up"
    timeout = "10s"

[[mounts]]
  source = "storage_data"
  destination = "/var/www/html/storage"
  initial_size = "1GB"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
